<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC H.264 Stream Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js" type="text/javascript"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #f5f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h2 { margin-bottom: 5px; color: #00adb5; }
        #status { color: #aaaaaa; margin-bottom: 20px; font-size: 14px; }
        .container {
            background-color: #2a2a35;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
        }
        /* Native video playback canvas optimized for low-overhead browser decoding */
        video {
            background-color: #000;
            border-radius: 8px;
            max-width: 100%;
            width: 640px;
            height: 480px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .controls { 
            margin-top: 15px; 
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }
        select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #1e1e24;
            color: #fff;
            width: 240px;
            cursor: pointer;
        }
        button {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            background-color: #00adb5;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #007a80; }
    </style>
</head>
<body>

    <div class="container">
        <h2>WebRTC C++ H.264 Stream Viewer</h2>
        <div id="status">Status: Connecting to signaling broker...</div>
        
        <video id="remoteVideo" autoplay playsinline controls muted></video>

        <div class="controls">
            <select id="peerSelect">
                <option value="">-- Scanning for Active H.264 Peers --</option>
            </select>
            <button id="connectBtn" onclick="startSignaling()">Connect Stream</button>
        </div>
    </div>

    <script>
        const signalingTopic = "webrtc/signaling";
        const viewerId = "viewer_" + Math.random().toString(16).substr(2, 6);
        let targetPeerId = "";
        
        let mqttClient;
        let peerConnection;
        
        const activePeers = new Map();
        const peerSelect = document.getElementById("peerSelect");
        const videoElement = document.getElementById("remoteVideo");

        // --- MQTT Setup & Signaling Layer ---
        mqttClient = new Paho.Client("e5122a5328ea4986a0295fa6e037655a.s2.eu.hivemq.cloud", Number(8884), viewerId);
        
        mqttClient.onConnectionLost = (responseObject) => {
            updateStatus("MQTT Disconnected: " + responseObject.errorMessage);
        };
        
        mqttClient.onMessageArrived = (message) => {
            try {
                const payload = JSON.parse(message.payloadString);
                
                // Track dynamic heartbeats from available C++ capture nodes
                if (payload.type === "presence" && payload.from) {
                    handlePresence(payload.from);
                    return;
                }

                // Drop signaling frames not explicitly designated for this browser viewer context
                if (payload.to !== viewerId) return;

                if (payload.type === "answer") {
                    console.log("Received SDP Answer from C++ Peer");
                    peerConnection.setRemoteDescription(new RTCSessionDescription(payload.data));
                } else if (payload.type === "ice") {
                    console.log("Received remote ICE candidate from C++ Peer");
                    if (peerConnection) {
                        peerConnection.addIceCandidate(new RTCIceCandidate({
                            candidate: payload.data.candidate,
                            sdpMid: payload.data.sdpMid,
                            sdpMLineIndex: payload.data.sdpMLineIndex
                        }));
                    }
                }
            } catch (e) {
                console.error("Error parsing signaling payload: ", e);
            }
        };

        const mqttOptions = {
            useSSL: true,
            userName: "admin",
            password: "admin1234S",
            onSuccess: () => {
                updateStatus("Connected to Signaling Broker. Scanning for active media nodes...");
                mqttClient.subscribe(signalingTopic);
            },
            onFailure: (err) => {
                updateStatus("MQTT Connection Failed: " + err.errorMessage);
            }
        };
        
        mqttClient.connect(mqttOptions);

        // --- Core Auto-Enumeration & Dynamic Node Tracking ---
        function handlePresence(peerId) {
            if (peerId === viewerId) return; 
            const now = Date.now();
            const isNew = !activePeers.has(peerId);
            
            activePeers.set(peerId, now);

            if (isNew) {
                console.log(`New Node Discovered: ${peerId}`);
                updatePeerDropdown();
            }
        }

        // Garbage collection sweep checking for offline camera sources (silent > 6s)
        setInterval(() => {
            const now = Date.now();
            let changed = false;

            for (const [peerId, lastSeen] of activePeers.entries()) {
                if (now - lastSeen > 6000) {
                    console.log(`Node dropped offline due to missing heartbeat: ${peerId}`);
                    activePeers.delete(peerId);
                    changed = true;
                }
            }

            if (changed) updatePeerDropdown();
        }, 2000);

        function updatePeerDropdown() {
            const currentSelection = peerSelect.value;
            peerSelect.innerHTML = "";

            if (activePeers.size === 0) {
                const opt = document.createElement("option");
                opt.value = "";
                opt.innerText = "-- Scanning for Active H.264 Peers --";
                peerSelect.appendChild(opt);
                return;
            }

            for (const peerId of activePeers.keys()) {
                const opt = document.createElement("option");
                opt.value = peerId;
                opt.innerText = `🎥 Camera Node: ${peerId}`;
                if (peerId === currentSelection) opt.selected = true;
                peerSelect.appendChild(opt);
            }
        }

        function updateStatus(text) {
            document.getElementById("status").innerText = `Status: ${text}`;
        }

        // --- WebRTC Core Session Negotiation Layer ---
        async function startSignaling() {
            targetPeerId = peerSelect.value;
            if (!targetPeerId) {
                alert("Please select an active camera node from the drop-down menu.");
                return;
            }

            updateStatus(`Negotiating parameters for target node: ${targetPeerId}...`);

            // Initialize connection containing Google's public routing STUN mapping infrastructure
            peerConnection = new RTCPeerConnection({
                iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
            });

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    sendSignal("ice", {
                        candidate: event.candidate.candidate,
                        sdpMid: event.candidate.sdpMid,
                        sdpMLineIndex: event.candidate.sdpMLineIndex
                    });
                }
            };

            // Intercept inbound WebRTC media track frames and map them directly into our video component
            peerConnection.ontrack = (event) => {
                console.log("📥 Hardware track bound. Inbound media stream attached!");
                if (videoElement.srcObject !== event.streams[0]) {
                    videoElement.srcObject = event.streams[0];
                    updateStatus("Link Verified. Decoding incoming low-latency H.264 video stream...");
                }
            };

            // Explicitly assert to the browser SDP constructor that we want to allocate receive-only video streams
            peerConnection.addTransceiver('video', { direction: 'recvonly' });

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            // Forward session description parameter matrix to C++ application
            sendSignal("offer", {
                sdp: offer.sdp,
                type: offer.type
            });
            
            updateStatus("Sent SDP Offer matrix. Awaiting pipeline sync answer...");
        }

        function sendSignal(type, data) {
            const payload = {
                type: type,
                from: viewerId,
                to: targetPeerId,
                data: data
            };
            const message = new Paho.Message(JSON.stringify(payload));
            message.destinationName = signalingTopic;
            mqttClient.send(message);
        }
    </script>
</body>
</html>
